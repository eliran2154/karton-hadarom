<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>הזמנה - קרטון הדרום</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial;background:#0f0f1a;color:#f0ead6;margin:0;padding:0 0 100px;-webkit-text-size-adjust:100%}header{position:sticky;top:0;background:#16213e;padding:18px;text-align:center;border-bottom:2px solid #c9a84c}h1{margin:0;font-size:24px}.wrap{padding:10px}.row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:#16213e;border:1px solid #2a3f60;border-radius:10px;padding:9px 12px;margin-bottom:7px;direction:rtl}.row span{flex:1;text-align:right;direction:rtl}.gap{height:18px}.q{display:flex;direction:rtl;flex:0 0 auto;border:1px solid #2a3f60;border-radius:8px;overflow:hidden}button,input{width:36px;height:34px;border:0;background:#0f0f1a;color:#f0ead6;text-align:center;font-size:16px}button{color:#c9a84c;font-size:20px}textarea{width:100%;box-sizing:border-box;min-height:70px;background:#16213e;color:#fff;border:1px solid #2a3f60;border-radius:10px;padding:10px}.warn{text-align:center;color:#e8c97a;font-weight:700;margin:12px 0}footer{position:fixed;bottom:0;left:0;right:0;background:#0f0f1a;border-top:2px solid #c9a84c;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}.send{width:auto;padding:0 18px;background:#25D366;color:#fff;border-radius:10px;font-weight:700}</style></head><body><header><div>✦ הזמנה ✦</div><h1>קרטון הדרום</h1></header><div class="wrap" id="products"></div><div class="wrap"><textarea id="notes" placeholder="הערות להזמנה..."></textarea><div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div></div><footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer><script>const GROUP_URL='https://chat.whatsapp.com/Lnb5d8TXrzTJ6saicBs7hs?s=cl&p=a&mlu=4',RLM='\u200F',LRM='\u200E',RLE='\u202B',PDF='\u202C';const G=[["קראפט 340","קראפט 370","קראפט 520","קראפט 650"],["פרגמנט 30/40 לבן","פרגמנט מודפס לבן","פרגמנט 40/50"],["פרגמנט חום 25/35","פרגמנט 30/40 חום","פרגמנט מודפס חום"],["פרגפלסט"],["פלייסמנט עיתון","פלייסמנט פרוצס","פלייסמנט 30/40 חום"],["נייר אפיה 23/33","סלייסים","קרפט פסים 25/35."],["עיתון חצי פוליו ‼️","עיתון פוליו ‼️.","עיתון 30/30","עיתון 80/120"],["נייר כוורת","צלופן 30/40 שקוף"],["משטח שקיות דליה","שקיות גיילורד"],["שקית 4 חום","שקית 4 לבן"],["שקית 8 חום","שקית 8 לבן"],["שקית 12 חום","שקית 12 לבן"],["שקית 14 חום","שקית 14 לבן","שקית 14 מודפס"],["שקית 16 חום","שקית 16 לבן"],["שקית 18 חום 70 גר"],["פיתה חום מודפס","פיתה לבן מודפס","פיתה חום חלק","פיתה לבן חלק"],["חצי בגט חום מודפס","חצי בגט לבן מודפס","חצי בגט חום","חצי בגט לבן"],["בגט שלם חום","בגט שלם לבן"],["שקית 14 חלון","שקית 16 חלון","חצי בגט חום חלון"],["שקיות זילוף"],["קונוס 14","קונוס 17","קונוס 21","דוחה שומן"],["שקית 12 אלומיניום","פיתה אלומיניום","חצי בגט אלומיניום","צ׳יפס אלומיניום לבן"],["סקופי","סירה חום קטנה","סירה חום גדולה","נקניקיה","מאפים 0.5 סגור","מאפים 1.5 סגור","מאפים סגור 6 פינות","מאפים 1.5 פתוח","קופסה לפיתה חום."],["קרטון קרפ","קרטון טורט גנרי","קרטון סופגניה","קרטון מעדנית","מכסה מעדנית","מגש חורים פלייבוקס"],["פס זהב 8/28","מגש זהב 14/35"],["מגש מלצרים 37","מגש מלצרים 50/60"],["מכסה 6B עבה ‼️","מכסה 5 עבה ‼️.","מכסה 12 עבה ‼️","מכסה TV עבה ‼️","מכסה 80A עבה ‼️","מכסה 90 עבה ‼️.","מכסה 105 עבה‼️"],["רולדה ארוך","וופל בלגי"],["מנשא זוגי חלק","מנשא זוגי מודפס"],["‼️*לידע נהג לקח החזרות*‼️"]];const wrap=document.getElementById('products');G.forEach((g,gi)=>{if(gi)wrap.insertAdjacentHTML('beforeend','<div class="gap"></div>');g.forEach(p=>{const r=document.createElement('div');r.className='row';const n=document.createElement('span');n.textContent=p;const q=document.createElement('div');q.className='q';const m=document.createElement('button');m.textContent='−';m.onclick=()=>chg(m,-1);const i=document.createElement('input');i.type='number';i.min='0';i.value='0';i.inputMode='numeric';i.addEventListener('input',refresh);const b=document.createElement('button');b.textContent='+';b.onclick=()=>chg(b,1);q.append(m,i,b);r.append(n,q);wrap.appendChild(r)})});function chg(btn,d){let i=btn.parentElement.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+d);refresh()}function refresh(){let t=0;document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);count.textContent=t}function orderLine(name,q){return RLM+'• '+name+RLM+': '+LRM+'*'+q+'*'+RLM}function copyText(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}async function sendOrder(){let lines=['🛒 *הזמנה - קרטון הדרום*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];let total=0;document.querySelectorAll('.row').forEach(r=>{let q=parseInt(r.querySelector('input').value)||0;if(q>0){lines.push(orderLine(r.querySelector('span').textContent,q));total+=q}});if(!total){alert('לא נבחרו פריטים');return}let n=notes.value.trim();if(n)lines.push('','📝 *הערות:* '+n);lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשר*');const msg=lines.map(x=>RLM+RLE+x+PDF+RLM).join('\n');let copied=false;try{await navigator.clipboard.writeText(msg);copied=true}catch(e){copied=copyText(msg)}if(copied){alert('ההזמנה הועתקה. הקבוצה תיפתח עכשיו — הדבק ושלח.')}else{alert('לא הצלחתי להעתיק אוטומטית. הקבוצה תיפתח עכשיו.')}location.href=GROUP_URL}</script></body></html>
